[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = [
    "B008",   # FastAPI Depends() in defaults
    "E501",   # line length is owned by black; long strings are fine
    "SIM105", # explicit try/except/pass reads better around cleanup code
]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
